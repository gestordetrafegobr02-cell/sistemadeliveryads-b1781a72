name: Sync dependency lockfiles

on:
  push:
    branches: [main]
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  sync-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply compatible dependency security fixes
        run: npm audit fix || true

      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only

      - name: Verify clean npm installation and production dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=low
          npm run build
          npx tsc --noEmit

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json bun.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already synchronized."
            exit 0
          fi
          git commit -m "chore: sync npm and bun lockfiles"
          git push origin main
