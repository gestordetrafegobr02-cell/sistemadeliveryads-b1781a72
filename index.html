<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Cardápio Digital</title>
    <meta name="description" content="Plataforma completa de gestão para delivery" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Delivery" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png?v=20" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/logo.png?v=20" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.png?v=20" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png?v=20" />
    <link rel="apple-touch-icon" sizes="167x167" href="/logo.png?v=20" />
    
    <!-- MS Tile -->
    <meta name="msapplication-TileImage" content="/logo.png?v=20" />
    <meta name="msapplication-TileColor" content="#f59e0b" />

    <!-- Open Graph (defaults, overridden dynamically per store via React Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png?v=20" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=20"></script>
  </body>
</html>
